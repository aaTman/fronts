[workspace]
channels = ["conda-forge"]
name = "fronts"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
tensorflow = "2.10.*"
shapely = ">=2.0.1,<3"
regionmask = ">=0.13.0,<0.14"
wandb = ">=0.23.1,<0.24"
netcdf4 = ">=1.6.2,<2"
dask = ">=2024.8.1,<2025"
distributed = ">=2024.8.1,<2025"
xarray = ">=2025.6.1,<2026"

[system-requirements]
libc = "2.17"
cuda = "12.0"
