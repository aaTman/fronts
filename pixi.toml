[workspace]
authors = ["mandelbaum.taylor@gmail.com <mandelbaum.taylor@gmail.com>"]
channels = ["conda-forge"]
name = "fronts"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
numpy = ">=1.26.4,<2"
pandas = ">=2.3.3,<3"
tensorflow-gpu = "2.10.0.*"
shapely = ">=2.0.1,<3"
regionmask = ">=0.13.0,<0.14"
wandb = ">=0.23.1,<0.24"
netcdf4 = ">=1.6.2,<2"
dask = ">=2023.3.0,<2024"
distributed = ">=2023.3.0,<2024"
xarray = ">=2024.3.0,<2025"
dacite = ">=1.9.2,<2"
py3nvml = ">=0.2.6,<0.3"
ipykernel = ">=7.1.0,<8"

[system-requirements]
libc = "2.17"
cuda = "12.0"
