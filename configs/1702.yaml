epochs: 5000
training_steps_per_epoch: 10
validation_steps_per_epoch: 51
validation_frequency: 1
verbose: 1
repeat: true
seed: 42
batch_size: 64
distribution: "mirrored"

model_config:
  name: "unet_3plus"
  batch_normalization: true
  num_filters: [16, 32, 64, 128]
  kernel_size: [5, 5, 5]
  pool_size: [2, 2, 1]
  upsample_size: [2, 2, 1]
  depth: 4
  modules_per_node: 2
  padding: "same"
  bias: true
  loss:
    name: "fractions_skill_score"
    config:
      mask_size: [3, 3]
      c: 1.0
      threshold: 0.5
  metric:
    name: "critical_success_index"
    config:
      class_weights: [0, 1, 1, 1, 1, 1]

  optimizer:
    name: "Adam"
    config:
      learning_rate: 0.0001
      beta_1: 0.9
      beta_2: 0.999

  convolution_activity_regularizer:
    regularizer:

  bias_vector:
    constraint:
    initializer:
      name: "zeros"
      config:
    regularizer:

  kernel_matrix:
    constraint:
    initializer:
      name: "glorot_uniform"
      config:
    regularizer:

  activation:
    name: "gelu"
    config:

  deep_supervision: true
  first_encoder_connections: true

data_config:
  train_years:
    [
      2008,
      2009,
      2010,
      2011,
      2012,
      2013,
      2014,
      2015,
      2016,
      2017,
      2020,
    ]
  val_years: [2018]
  test_years: [2019]
  shuffle: true
  normalization_method: "min-max"

  augmentation:
    flip_chance_lat: 0.29
    flip_chance_lon: 0.29
    u_wind_index: 3   # "u" in the variable ordering [T, Td, Tv, u, v, q, RH, sp_z, theta_e]
    v_wind_index: 4   # "v" in the variable ordering

  num_classes: 6

  # ---- ERA5 + fronts pipeline ----
  # Used when tf_dataset is absent or null. Requires era5 and fronts.
  era5_config:
    domain_extent: [-140.0, -60.0, 20.0, 60.0]
    # Use canonical (pressure-level) names for variables that have both surface
    # and pressure-level representations.  Surface-only variables (e.g.
    # "mean_sea_level_pressure") are listed here directly.
    # The mapping from pressure-level name to surface name is defined in
    # fronts.data.config.SURFACE_VARIABLE_MAP and applied automatically when
    # "surface" appears in the levels list.
    # Raw ERA5 variables are loaded from the zarr store.  Derived variables
    # (registered in DERIVED_VARIABLE_REGISTRY) are auto-detected and computed
    # after stacking.  Order matters: dependencies first (e.g. dewpoint before
    # virtual_temperature).
    variables:
      - "temperature"                       # raw — surface: 2m_temperature
      - "specific_humidity"                 # raw — surface: surface_specific_humidity
      - "u_component_of_wind"               # raw — surface: 10m_u_component_of_wind
      - "v_component_of_wind"               # raw — surface: 10m_v_component_of_wind
      - "geopotential"                      # raw — geopotential (m²/s²)
      - "mean_sea_level_pressure"           # raw — surface-only
      - "dewpoint"                          # derived — from specific_humidity + pressure
      - "virtual_temperature"               # derived — from temperature + dewpoint + pressure
      - "relative_humidity"                 # derived — from temperature + dewpoint
      - "equivalent_potential_temperature"  # derived — from temperature + dewpoint + pressure
      - "geopotential_height"              # derived — geopotential / 98.0665 → dam
    # levels may contain "surface" and/or integer hPa values in any order.
    # "surface" triggers loading of the surface counterpart for each variable.
    levels: ["surface", 1000, 950, 900, 850]
    store: "gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3"
    chunks:
      time: 48
    consolidated: true
    # Years are replaced by DataConfig.build()
    years:
    local_zarr_path: "/ourdisk/hpc/ai2es/tman/data/fronts/era5"
  target_config:
    icechunk_store_path: "/ourdisk/hpc/ai2es/tman/restructured_front_data/icechunk"
    file_path: "/ourdisk/hpc/ai2es/fronts/raw_front_data/netcdf"
    front_types: ["CF", "WF", "SF", "OF", "DL"]
    front_dilation: 1  # configurable — set to N to expand front labels by N pixels

wandb_config:
  project_name: "fronts"
  model_run_name: "1702_retrain_era5"
  wandb_filepath: "/ourdisk/hpc/ai2es/tman/models/1702_retrain_era5.keras"
  # -- Optional parameters --
  # log_frequency:
  # upload_checkpoints:
  # api_key:

callbacks_config:
  monitor: "val_loss"
  verbose: 1
  save_best_only: true
  save_weights_only: false
  save_freq: "epoch"
  model_checkpoint_path: "/ourdisk/hpc/ai2es/tman/models/1702_retrain_era5.keras"
  csv_logger_path: "/ourdisk/hpc/ai2es/tman/logs/1702_retrain_era5.csv"
  patience: 55

# ---- Prediction config ----
# Loaded as a nested PredictConfig when using the predict workflow.
# TIME SELECTION — uncomment exactly one block below.
# Use ISO 8601 format with a "T" separator (e.g. "2024-06-01T12:00:00") so that
# PyYAML treats the value as a string rather than a date, allowing dacite to cast
# it to datetime.datetime correctly.
predict:
  # Option A: most recent timestep available in the zarr store (no date needed)
  time_selection:
    most_recent: true

  # Option B: explicit individual analysis times (date + hour each)
  # time_selection:
  #   timestamps:
  #     - "2024-06-01T12:00:00"
  #     - "2024-06-02T00:00:00"

  # Option C: all timesteps in an inclusive date range
  # time_selection:
  #   date_range:
  #     - "2024-06-01T00:00:00"
  #     - "2024-06-07T18:00:00"

  normalization_method: "min-max"

  era5:
    domain_extent: [-140.0, -60.0, 20.0, 60.0]
    variables:
      - "temperature"
      - "specific_humidity"
      - "u_component_of_wind"
      - "v_component_of_wind"
      - "geopotential"
      - "mean_sea_level_pressure"
      - "dewpoint"
      - "virtual_temperature"
      - "relative_humidity"
      - "equivalent_potential_temperature"
      - "geopotential_height"
    levels: ["surface", 1000, 950, 900, 850]
    store: "gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3"
    chunks:
      time: 48
    consolidated: true
