run_name: brier_conus_3d_comparison

realtime_config:
  model_path: "/ourdisk/hpc/ai2es/tman/models/${run_name}/_best_loss.keras"
  era5_uri: "arraylake://earthmover-public/era5"
  outdir: "/ourdisk/hpc/ai2es/tman/models/realtime/${run_name}/"
  coordinates: [25.0, 56.75, 228.0, 299.75]  # [lat_min, lat_max, lon_min, lon_max]; CONUS box, matches training
  pressure_levels: [1000, 925, 850, 700, 500, 300]
  time_resolution: "6h"  # must match training
  volume_inputs: true  # batches shaped (lat, lon, level, variable) for Conv3D, matches training
  variables: [
    "temperature",
    "dewpoint_temperature",
    "virtual_temperature",
    "u_component_of_wind",
    "v_component_of_wind",
    "relative_humidity",
    "specific_humidity",
    "equivalent_potential_temperature",
    "geopotential",
    "mean_sea_level_pressure",
    ]
  front_types: [CF, WF, SF, OF, DL]
  gpu_device: null
