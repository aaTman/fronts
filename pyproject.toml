
[project]
name = "fronts"
version = "0.2.0"
description = "FrontFinder AI for finding various frontal and baroclinic boundaries"
requires-python = ">=3.11,<3.14"
keywords = [
    "weather",
    "weather fronts",
    "cold fronts",
    "unet",
    "frontal boundary",
    "machine learning",
    "artificial intelligence",
    "ai",
    "ml",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
license = "CC0-1.0"
license-files = [
    "LICENSE",
]
readme = "README.md"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
numpy = ">=1.26.4,<2"
dacite = ">=1.9.2,<2"
ipykernel = ">=7.2.0,<8"

[tool.pixi.feature.train]
platforms = ["linux-64"]

[tool.pixi.feature.train.dependencies]
fronts = { path = "." }
pandas = ">=2.3.3,<3"
shapely = ">=2.0.1,<3"
regionmask = ">=0.13.0,<0.14"
wandb = ">=0.24"
netcdf4 = ">=1.6.2,<2"
dask = ">=2023.3.0,<2024"
distributed = ">=2023.3.0,<2024"
xarray = ">=2024.3.0,<2025"
scikit-image = ">=0.22.0"
h5py = ">=3.11.0"
xbatcher = ">=0.4.0,<0.5"
gcsfs = ">=2026.2.0,<2027"

[tool.pixi.feature.train.pypi-dependencies]
tensorflow = { extras = ["and-cuda"] }
obstore = "*"
s3fs = ">=2024.6.0"

# ---------------------------------------------------------------------------
# mac feature: same deps as train but with CPU-only TensorFlow for osx-arm64.
# Use this environment for local dry-run testing on Apple Silicon.
# ---------------------------------------------------------------------------
[tool.pixi.feature.mac]
platforms = ["osx-arm64"]

[tool.pixi.feature.mac.dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.26.4,<2"
protobuf = ">=3.20,<5"
dacite = ">=1.9.2,<2"
fronts = { path = "." }
pandas = ">=2.3.3,<3"
shapely = ">=2.0.1,<3"
regionmask = ">=0.13.0,<0.14"
wandb = ">=0.24"
netcdf4 = ">=1.6.2,<2"
dask = ">=2023.3.0,<2024"
distributed = ">=2023.3.0,<2024"
xarray = ">=2024.3.0,<2025"
scikit-image = ">=0.22.0"
h5py = ">=3.11.0"
xbatcher = ">=0.4.0,<0.5"
# gcsfs omitted — not needed locally (no ARCO zarr store access on Mac)

[tool.pixi.feature.mac.pypi-dependencies]
# Plain tensorflow works on macOS ARM since TF 2.13 (unified with tensorflow-macos).
# Pinned to 2.16.* — well-tested on ARM macOS, compatible with numpy<2.
tensorflow = ">=2.16,<2.17"
obstore = "*"
s3fs = ">=2024.6.0"

[tool.pixi.feature.test.dependencies]
python = ">=3.10,<3.14"
dacite = ">=1.9.2,<2"
pyyaml = ">=6.0"
numpy = ">=1.26.4,<2"

[tool.pixi.feature.test.tasks]
test = "PYTHONPATH=src python -m pytest tests/ -v"

[tool.pixi.system-requirements]
libc = "2.17"

[tool.pixi.environments]
default = { features = ["train"], solve-group = "default" }
dev = { features = ["dev", "train"], solve-group = "default" }
test = { features = ["test"], solve-group = "test", no-default-feature = true }
mac = { features = ["mac"], solve-group = "mac", no-default-feature = true }

[dependency-groups]
dev = [
    "deptry>=0.23.0",
    "isort>=6.0.1",
    "lxml-stubs>=0.5.1",
    "mypy>=1.14.1",
    "pandas-stubs>=2.3.0.250703",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.4",
    "types-pytz>=2025.2.0.20250809",
    "types-pyyaml>=6.0.12.20241230",
    "types-tqdm>=4.67.0.20250809",
    "twine>=5.1.1",
]

test = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

#TODO: swap wget with requests in code
data = ["cdsapi", "wget"]
train = ["zarr>=3.1.5,<4", "icechunk>=1.1.20,<2"]

[build-system] 
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/fronts"]

[tool.hatch.build.targets.sdist]
include = ["src/fronts/**/*"]

[tool.pixi.package] 
name = "fronts"
version = "0.1.0"

[tool.pixi.package.host-dependencies] 
hatchling = ">=1.26.3"

[tool.pixi.package.build] 
backend = { name = "pixi-build-python", version = "0.4.*" }

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
ignore = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
case-sensitive = true
