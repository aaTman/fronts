
[project]
name = "fronts"
version = "0.2.0"
description = "FrontFinder AI for finding various frontal and baroclinic boundaries"
requires-python = ">=3.10,<3.14"
keywords = [
    "weather",
    "weather fronts",
    "cold fronts",
    "unet",
    "frontal boundary",
    "machine learning",
    "artificial intelligence",
    "ai",
    "ml",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: CC0 1.0 Universal",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
license = { file = "LICENSE" }
readme = "README.md"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
numpy = ">=1.26.4,<2"
pandas = ">=2.3.3,<3"
tensorflow-gpu = "2.10.0.*"
shapely = ">=2.0.1,<3"
regionmask = ">=0.13.0,<0.14"
wandb = ">=0.23.1,<0.24"
netcdf4 = ">=1.6.2,<2"
dask = ">=2023.3.0,<2024"
distributed = ">=2023.3.0,<2024"
xarray = ">=2024.3.0,<2025"
dacite = ">=1.9.2,<2"

[tool.pixi.system-requirements]
libc = "2.17"
cuda = "12.0"
